<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kushafah Portal</title>
    <meta name="description" content="Official management portal for Arabiyya Rovers Scouting Crew - Member directory, attendance tracking, syllabus progression, events calendar, and governance." />
    <meta name="theme-color" content="#002B7F" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kushafah Portal" />
    <meta property="og:description" content="Scouting management, attendance, syllabus progression, and crew governance portal." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* Instant loading screen style before React mounts */
      body {
        margin: 0;
        padding: 0;
        background-color: #0E1015;
        color: #F8FAFC;
        font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at center, #161B26 0%, #0E1015 100%);
      }
      #root:empty::before {
        content: '';
        width: 56px;
        height: 56px;
        border: 4px solid rgba(255, 199, 44, 0.2);
        border-top-color: #FFC72C;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      #root:empty::after {
        content: 'Kushafah Portal Loading...';
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #94A3B8;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#0E1015] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
